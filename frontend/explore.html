    <link rel="stylesheet" href="css/styles.css">
    <style>
        .explore-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 24px;
            align-items: start;
        }

        .search-hero {
            padding: 32px 24px;
            background: rgba(255,255,255,0.7);
            border-radius: var(--clay-radius);
            box-shadow: var(--clay-shadow-sm);
            border: 1px solid rgba(255,255,255,0.6);
            backdrop-filter: blur(12px);
            margin-bottom: 24px;
            text-align: center;
        }

        .search-hero h1 {
            font-size: 2rem;
            margin-bottom: 16px;
        }

        .search-bar-lg {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }
        
        .search-bar-lg input {
            width: 100%;
            padding: 16px 20px 16px 48px;
            border-radius: 16px;
            background: rgba(255,255,255,0.8);
            border: 2px solid var(--clr-border);
            box-shadow: var(--clay-shadow-in);
            font-size: 1.05rem;
            color: var(--clr-text);
            transition: all var(--transition-fast);
        }

        .search-bar-lg input:focus {
            background: rgba(255,255,255,1);
            border-color: var(--clr-peach-dark);
            outline: none;
            box-shadow: 0 0 0 4px rgba(253, 188, 180, 0.25), var(--clay-shadow-in);
        }

        .search-bar-lg svg {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px; height: 20px;
            color: var(--clr-text-muted);
            pointer-events: none;
        }

        .tabs-header {
            display: flex;
            gap: 24px;
            border-bottom: 2px solid var(--clr-border);
            margin-bottom: 24px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 12px 16px;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--clr-text-muted);
            cursor: pointer;
            position: relative;
            transition: color var(--transition-fast);
        }

        .tab-btn:hover { color: var(--clr-text); }
        .tab-btn.active { color: var(--clr-peach-dark); }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px; left: 0; right: 0;
            height: 3px;
            background: var(--clr-peach-dark);
            border-radius: 3px 3px 0 0;
        }

        .search-results-section {
            display: none;
        }
        
        .search-results-section.active {
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--clr-text-muted);
            background: rgba(255,255,255,0.5);
            border-radius: 16px;
            border: 1px dashed var(--clr-border);
        }

        .empty-state svg {
            width: 48px; height: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        @media (max-width: 1024px) {
            .explore-layout { grid-template-columns: 1fr; }
            .sidebar-right { display: none; }
        }
    </style>

    <link rel="icon" type="image/x-icon" href="favicon.ico?v=1785165838924">
</head>

    <div class="page-wrapper">
        <div class="container">
            <div class="explore-layout">
                
                <!-- Main Content -->
                <main aria-label="Explore">
                    <div class="search-hero">
                        <h1>Discover Velora</h1>
                        <div class="search-bar-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <input type="text" id="search-input" placeholder="Search for people or posts..." autocomplete="off">
                        </div>
                    </div>

                    <div class="tabs-header">
                        <button class="tab-btn active" data-target="posts-results">Posts</button>
                        <button class="tab-btn" data-target="users-results">People</button>
                    </div>

                    <div id="posts-results" class="search-results-section active">
                        <div id="posts-container">

                    <div id="users-results" class="search-results-section">

                <!-- Right Sidebar -->
