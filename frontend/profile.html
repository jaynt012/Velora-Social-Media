<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velora — Profile</title>
    <meta name="description" content="View Velora user profile.">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .profile-header {
            position: relative;
            background: rgba(255,255,255,0.75);
            border-radius: var(--clay-radius);
            box-shadow: var(--clay-shadow);
            border: 1px solid rgba(255,255,255,0.6);
            backdrop-filter: blur(12px);
            margin-bottom: 24px;
            overflow: hidden;
        }

        .cover-photo {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, var(--clr-peach-dark), var(--clr-sky-dark));
            object-fit: cover;
        }

        .profile-info {
            padding: 0 24px 24px;
            position: relative;
        }

        .profile-avatar-lg {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--clr-bg);
            background: var(--clr-bg);
            margin-top: -60px;
            position: relative;
            z-index: 2;
            object-fit: cover;
            box-shadow: var(--clay-shadow-sm);
        }

        .profile-actions {
            position: absolute;
            top: 24px;
            right: 24px;
            display: flex;
            gap: 12px;
        }

        .profile-name {
            font-size: 1.8rem;
            margin-top: 12px;
            font-family: 'Outfit', sans-serif;
        }

        .profile-handle {
            color: var(--clr-text-muted);
            font-size: 1.05rem;
            margin-bottom: 16px;
        }

        .profile-bio {
            font-size: 1rem;
            margin-bottom: 20px;
            max-width: 600px;
        }

        .profile-meta {
            display: flex;
            gap: 20px;
            color: var(--clr-text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .profile-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .profile-meta svg {
            width: 16px; height: 16px;
        }

        .profile-stats {
            display: flex;
            gap: 24px;
            font-size: 0.95rem;
        }

        .profile-stats b {
            color: var(--clr-text);
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
        }

        .profile-tabs {
            display: flex;
            gap: 24px;
            border-bottom: 2px solid var(--clr-border);
            margin-bottom: 24px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 12px 16px;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--clr-text-muted);
            cursor: pointer;
            position: relative;
            transition: color var(--transition-fast);
        }

        .tab-btn:hover { color: var(--clr-text); }
        .tab-btn.active { color: var(--clr-peach-dark); }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px; left: 0; right: 0;
            height: 3px;
            background: var(--clr-peach-dark);
            border-radius: 3px 3px 0 0;
        }

        /* Edit Profile Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            width: 100%;
            max-width: 500px;
            background: rgba(255,255,255,0.9);
            border-radius: var(--clay-radius);
            box-shadow: var(--clay-shadow);
            border: 1px solid rgba(255,255,255,0.6);
            padding: 32px;
            transform: translateY(20px);
            transition: transform 0.2s ease;
        }
        
        .modal-overlay.show .modal-content { transform: translateY(0); }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h2 { font-size: 1.5rem; }

        .close-modal {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--clr-text-muted);
        }

        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
    </style>

    <link rel="icon" type="image/x-icon" href="favicon.ico?v=1785165838935">
</head>

    <!-- Page Body -->
    <div class="page-wrapper">
        <div class="container" style="max-width: 800px;">
            
            <div id="profile-skeleton" style="padding:40px; text-align:center;"><span class="spinner"></span></div>
            
            <div id="profile-content" style="display:none;" class="fade-in">
                <!-- Header -->
                <div class="profile-header">
                    <img src="" alt="Cover" class="cover-photo" id="profile-cover">
                    <div class="profile-info">
                        <img src="" alt="Avatar" class="profile-avatar-lg" id="profile-avatar">
                        
                        <div class="profile-actions" id="profile-actions">
                            <!-- Buttons injected here -->
                        </div>

                        <h1 class="profile-name" id="profile-name">Name</h1>
                        <div class="profile-handle" id="profile-handle">@handle</div>
                        <p class="profile-bio" id="profile-bio"></p>

                        <div class="profile-meta">
                            <span id="profile-location" style="display:none;">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                                <i></i>
                            </span>
                            <span id="profile-website" style="display:none;">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                                <a href="#" target="_blank" style="color:var(--clr-sky-dark); font-weight:600;"></a>
                            </span>
                            <span id="profile-joined">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                                Joined
                            </span>
                        </div>

                        <div class="profile-stats">
                            <div class="clickable-stat" id="following-stat" style="cursor:pointer;"><b id="count-following">0</b> Following</div>
                            <div class="clickable-stat" id="followers-stat" style="cursor:pointer;"><b id="count-followers">0</b> Followers</div>
                        </div>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="profile-tabs">
                    <button class="tab-btn active">Posts</button>
                    <!-- Future: Likes, Media -->
                </div>

                <!-- Posts List -->
                <div id="posts-container">
                    <div style="text-align:center; padding:40px;"><span class="spinner"></span></div>
                </div>
            </div>

        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Profile</h2>
                <button class="close-modal" id="close-modal-btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>
            <form id="edit-profile-form">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" id="edit-name" class="clay-input" placeholder="Your display name">
                </div>
                <div class="form-group">
                    <label class="form-label">Bio</label>
                    <textarea id="edit-bio" class="clay-input" rows="3" placeholder="Tell us about yourself..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Location</label>
                    <input type="text" id="edit-location" class="clay-input" placeholder="e.g. San Francisco, CA">
                </div>
                <div class="form-group">
                    <label class="form-label">Website</label>
                    <input type="url" id="edit-website" class="clay-input" placeholder="https://...">
                </div>
                <button type="submit" class="clay-btn" style="width:100%; margin-top:16px;" id="save-profile-btn">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Connections Modal -->
    <div class="modal-overlay" id="connections-modal">
        <div class="modal-content" style="max-width: 450px; padding: 20px;">
            <div class="modal-header" style="margin-bottom: 12px; border-bottom: 1px solid var(--clr-border); padding-bottom: 12px;">
                <div style="display:flex; gap: 20px;" id="connections-tabs">
                    <button class="tab-btn active" data-tab="followers" style="padding: 4px 0;">Followers</button>
                    <button class="tab-btn" data-tab="following" style="padding: 4px 0;">Following</button>
                </div>
                <button class="close-modal" id="close-connections-modal" style="margin-top: -8px;"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>
            <div id="connections-list" style="max-height: 400px; overflow-y: auto; padding: 10px 0;">
                <!-- User items will be injected here -->
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/api.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/profile.js?v=2"></script>
</body>
</html>
