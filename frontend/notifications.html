    <style>
        .notif-container {
            max-width: 680px;
            margin: 0 auto;
        }

        .notif-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .notif-header h1 {
            font-size: 2rem;
        }

        .notif-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .notif-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 20px 24px;
            background: rgba(255,255,255,0.75);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: var(--clay-shadow-sm);
            backdrop-filter: blur(8px);
            transition: transform var(--transition-fast), background var(--transition-fast);
            position: relative;
            animation: floatUp 0.4s ease forwards;
        }

        .notif-item.unread {
            border-left: 3px solid var(--clr-peach-dark);
            background: rgba(255, 240, 235, 0.9);
        }

        .notif-item:hover {
            transform: translateY(-2px);
        }

        .notif-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.1rem;
        }

        .notif-icon.like     { background: rgba(225, 29, 72, 0.12);  color: #e11d48; }
        .notif-icon.comment  { background: rgba(99, 102, 241, 0.12); color: #6366f1; }
        .notif-icon.follow   { background: rgba(16, 185, 129, 0.12); color: #10b981; }
        .notif-icon.message  { background: rgba(251, 146, 60, 0.12); color: #f97316; }

        .notif-body {
            flex: 1;
        }

        .notif-text {
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .notif-text strong {
            font-weight: 700;
            color: var(--clr-text);
        }

        .notif-preview {
            margin-top: 6px;
            font-size: 0.85rem;
            color: var(--clr-text-muted);
            background: rgba(0,0,0,0.04);
            padding: 8px 12px;
            border-radius: 8px;
            border-left: 2px solid var(--clr-border);
            font-style: italic;
        }

        .notif-time {
            font-size: 0.8rem;
            color: var(--clr-text-muted);
            margin-top: 6px;
        }

        .empty-notif {
            text-align: center;
            padding: 64px 24px;
            color: var(--clr-text-muted);
        }

        .empty-notif svg {
            width: 64px;
            height: 64px;
            opacity: 0.3;
            margin-bottom: 16px;
        }
    </style>
